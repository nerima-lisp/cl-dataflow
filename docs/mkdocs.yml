# cl-dataflow documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build --strict -f docs/mkdocs.yml
# Serve:   mkdocs serve  -f docs/mkdocs.yml
# The Nix flake (`nix build .#docs`) drives the same config offline.
#
# Start from the repository root, not from docs/: pymdownx.snippets resolves
# `--8<-- "CHANGELOG.md"` relative to the working directory. Use
# `mkdocs serve --no-strict` while editing if warnings-as-errors get in the way.

site_name: cl-dataflow
site_description: >-
  Composable computation graphs, pipelines, event-driven workflows, state
  machines, and effect boundaries for Common Lisp.
site_author: cl-dataflow contributors
site_url: https://nerima-lisp.github.io/cl-dataflow/

repo_name: nerima-lisp/cl-dataflow
repo_url: https://github.com/nerima-lisp/cl-dataflow
edit_uri: edit/main/docs/src/

# Content lives in docs/src, matching the sibling cl-weave project layout.
docs_dir: src
site_dir: ../site
use_directory_urls: true

# Also set here, not only passed as `--strict` from flake.nix, so that every
# invocation path (including `mkdocs serve`) applies the same gate.
strict: true

copyright: Copyright &copy; cl-dataflow contributors — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/graph-outline
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/cl-dataflow
      name: cl-dataflow on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  # Callouts / admonitions.
  - admonition
  - pymdownx.details
  # Code blocks: syntax highlighting, line numbers, inline highlighting.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # base_path is relative to mkdocs' working directory, which is the repository
  # root (see the header). check_paths turns a missing include into a build
  # failure rather than a silently empty page.
  - pymdownx.snippets:
      base_path:
        - "."
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs (e.g. the Nix run / Quicklisp / local-checkout install paths).
  - pymdownx.tabbed:
      alternate_style: true
  # Task lists, key bindings, smart symbols. pymdownx.emoji is deliberately
  # absent: the docs do not use emoji, and leaving the extension configured
  # invites someone to conclude that they may.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

# Six fixed sections in this order, per the org docs standard: Home, Getting
# Started, Guide, Reference, Internals, Project. They track the reader's state
# — not yet running, running but new to the design, looking something up,
# changing the internals, contributing — and readership drops at each step, so
# reference and internals sit at the back.
#
# Guide topics are ordered by dependency, not alphabetically: each page uses
# vocabulary introduced by the ones above it.
#
# Every page under docs/src/ must appear here. `strict: true` fails the build
# on an unlisted page, which is what keeps this list from falling behind.
nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quick-start.md
  - Guide:
      - Core Concepts: core-concepts.md
      - Graphs: graphs.md
      - Graph Algorithms: graph-algorithms.md
      - Pipelines and Workflows: pipelines.md
      - State Machines: state-machines.md
      - Events and Effects: events-and-effects.md
      - Streams (Pull): streams.md
      - Reactive Subjects (Push): reactive.md
      - Combinators and Resilience: combinators.md
      - Observability and Serialization: observability.md
      - Examples: examples.md
  - Reference:
      - Public API Reference: api-reference.md
  - Internals:
      - Architecture: architecture.md
  - Project:
      - Development: development.md
      - Changelog: changelog.md

# docs/notes/ holds long-lived measurement records that are not public
# documentation. Declaring it here keeps `strict: true` from failing the build
# the moment such a note is added.
not_in_nav: |
  notes/
