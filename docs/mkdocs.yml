# cl-dataflow documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build -f docs/mkdocs.yml --strict
# Serve:   mkdocs serve  -f docs/mkdocs.yml
# The Nix flake (`nix build .#docs`) drives the same config offline.

site_name: cl-dataflow
site_description: >-
  Composable computation graphs, pipelines, event-driven workflows, state
  machines, and effect boundaries for Common Lisp.
site_author: cl-dataflow contributors
site_url: https://nerima-lisp.github.io/cl-dataflow/

repo_name: nerima-lisp/cl-dataflow
repo_url: https://github.com/nerima-lisp/cl-dataflow
edit_uri: edit/main/docs/src/

# Content lives in docs/src, matching the sibling cl-weave project layout.
docs_dir: src
site_dir: ../site
use_directory_urls: true

copyright: Copyright &copy; cl-dataflow contributors — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/graph-outline
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/cl-dataflow
      name: cl-dataflow on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  # Callouts / admonitions.
  - admonition
  - pymdownx.details
  # Code blocks: syntax highlighting, line numbers, inline highlighting.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs (e.g. the Nix run / Quicklisp / local-checkout install paths).
  - pymdownx.tabbed:
      alternate_style: true
  # Task lists, key bindings, smart symbols, emoji.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

nav:
  - Home: README.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quick-start.md
      - Core Concepts: core-concepts.md
  - Guide:
      - Pipelines and Workflows: pipelines.md
      - Graphs: graphs.md
      - Graph Algorithms: graph-algorithms.md
      - State Machines: state-machines.md
      - Events and Effects: events-and-effects.md
      - Streams (Pull): streams.md
      - Reactive Subjects (Push): reactive.md
      - Combinators and Resilience: combinators.md
      - Observability and Serialization: observability.md
  - Reference:
      - Public API Reference: api-reference.md
      - Architecture: architecture.md
      - Examples: examples.md
      - Testing and Coverage: testing.md
  - Project:
      - Changelog: changelog.md
      - Contributing: contributing.md
      - Security Policy: security.md
      - Code of Conduct: code-of-conduct.md
